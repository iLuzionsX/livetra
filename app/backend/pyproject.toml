[project]
name = "livetr3-backend"
version = "0.1.0"
description = "Local-first live transcription and translation backend for Gemma 4 E4B on MLX."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "websockets>=14.0",
  "pydantic>=2.10.0",
  "numpy>=2.1.0",
  "soundfile>=0.12.1",
  "mlx>=0.22.0",
  "mlx-vlm>=0.7.3",
  "python-dotenv>=1.0.1",
  "silero-vad>=5.1.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
]
test = [
  "psutil>=7.0.0",
  "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
