name: LiveTR3 Validation

on:
  push:
  pull_request:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast:
    name: Backend protocol and transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade "pytest>=8.3" "pydantic>=2.10"

      - name: Run deterministic backend suite
        env:
          PYTHONPATH: app/backend
        run: python -m pytest -q app/backend/tests

  native-swift:
    name: Native macOS build and unit tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run native Swift tests
        run: swift test --package-path macos/LiveTR3Mac

      - name: Build native app in release mode
        run: swift build --package-path macos/LiveTR3Mac -c release
